<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Панель дня</title>
<meta name="theme-color" content="#14171A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Панель дня" />
<link rel="manifest" id="manifest-link" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #14171A; color: #EDEFF1; font-family: 'Inter', sans-serif; }
  input, select, button, textarea { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, button:focus-visible, textarea:focus { outline: 2px solid #E8A33D !important; outline-offset: 1px; }
  input::placeholder, textarea::placeholder { color: #57616B; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  button { cursor: pointer; }
  ::-webkit-scrollbar { display: none; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 16px 12px; border-bottom: 1px solid #1F2429; }
  .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #8B95A1; text-transform: capitalize; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0; letter-spacing: -0.3px; }
  main { flex: 1; padding: 16px; padding-bottom: 90px; max-width: 480px; width: 100%; margin: 0 auto; }

  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; margin: 0; color: #EDEFF1; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .muted { color: #8B95A1; }

  /* Segmented control */
  .segmented { display: flex; gap: 4px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
  .segmented button { flex: 1; background: none; border: none; border-radius: 6px; padding: 8px 4px; font-size: 12px; color: #8B95A1; font-weight: 500; }
  .segmented button.active { background: #20252A; color: #EDEFF1; }

  /* Filter chips */
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; }
  .chip { flex-shrink: 0; padding: 7px 13px; border-radius: 16px; border: 1px solid #262C31; background: #1B1F23; color: #8B95A1; font-size: 12px; white-space: nowrap; }
  .chip.active { background: #E8A33D; color: #14171A; border-color: #E8A33D; font-weight: 600; }

  /* Task items */
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; margin-top: 6px; }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .task-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B95A1; }
  .task-label { flex: 1; font-size: 14px; color: #EDEFF1; line-height: 1.35; }
  .icon-btn { background: none; border: none; display: flex; padding: 2px; opacity: 0.6; flex-shrink: 0; }
  .icon-btn.check { opacity: 1; margin-top: 1px; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .list-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .repeat-badge { font-size: 10px; color: #57616B; display: flex; align-items: center; gap: 3px; }
  .empty-state { font-size: 13px; color: #57616B; padding: 24px 4px; text-align: center; }

  .add-row { display: flex; gap: 6px; margin-top: 12px; padding: 10px; background: #1B1F23; border: 1px dashed #2A3036; border-radius: 8px; flex-wrap: wrap; }
  .field { background: #14171A; border: 1px solid #2A3036; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #EDEFF1; outline: none; }
  .btn-add { background: #E8A33D; border: none; border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-add-labeled { display: flex; align-items: center; gap: 4px; padding: 6px 12px; margin-top: 8px; }
  .btn-add-labeled span { font-size: 12px; color: #14171A; font-weight: 600; }
  .toggle-add-btn { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: #1B1F23; border: 1px dashed #2A3036; border-radius: 8px; color: #8B95A1; font-size: 13px; width: 100%; margin-top: 12px; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button { background: none; border: none; display: flex; padding: 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 10px; color: #57616B; padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 8px; border: 1px solid #262C31; background: #1B1F23; color: #EDEFF1; font-size: 12px; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; gap: 2px; }
  .cal-cell.today { border-color: #E8A33D; }
  .cal-cell.selected { background: #20252A; border-color: #5B8FE0; }
  .cal-dots { display: flex; gap: 2px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }

  /* Summary grid (finance) */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #1B1F23; border: 1px solid #262C31; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .stat-label { font-size: 11px; color: #8B95A1; margin-bottom: 2px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }
  .stat-value.big { font-size: 19px; }

  .fin-section { margin-bottom: 18px; }
  .fin-title { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .fin-title h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; margin: 0; color: #EDEFF1; }
  .fin-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .fin-row input { flex: 1; min-width: 0; }

  /* Transactions */
  .type-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .type-toggle button { flex: 1; padding: 9px; border-radius: 6px; border: 1px solid #262C31; background: #1B1F23; color: #8B95A1; font-size: 13px; font-weight: 600; }
  .type-toggle button.active.expense { background: #E2574C; color: #fff; border-color: #E2574C; }
  .type-toggle button.active.income { background: #3ECF8E; color: #14171A; border-color: #3ECF8E; }

  .tx-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; margin-top: 6px; }
  .tx-cat-dot { width: 4px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 13px; color: #EDEFF1; }
  .tx-note { font-size: 11px; color: #57616B; margin-top: 1px; }
  .tx-date { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #57616B; }
  .tx-amount { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; flex-shrink: 0; }

  .cat-bar-item { margin-top: 10px; }
  .cat-bar-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .cat-bar-track { height: 7px; background: #20252A; border-radius: 4px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 4px; }

  /* Edit task modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .modal-sheet { width: 100%; max-width: 480px; background: #1B1F23; border-top: 1px solid #262C31; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow-y: auto; }
  .modal-sheet h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin: 0 0 12px; }
  .modal-field-label { font-size: 11px; color: #8B95A1; margin: 10px 0 4px; }
  .modal-sheet .field { width: 100%; }
  .quick-date-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .quick-date-chip { padding: 6px 12px; border-radius: 14px; border: 1px solid #262C31; background: #14171A; color: #8B95A1; font-size: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; }
  .btn-save { background: #E8A33D; color: #14171A; }
  .btn-delete { background: #2A1F20; color: #E2574C; border: 1px solid #3A2427 !important; }
  .btn-cancel { background: #20252A; color: #8B95A1; border: 1px solid #262C31 !important; }
  .task-title-clickable { cursor: pointer; }

  nav.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #1B1F23; border-top: 1px solid #262C31; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabbar .inner { display: flex; max-width: 480px; width: 100%; }
  nav.tabbar button { flex: 1; background: none; border: none; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav.tabbar button span { font-size: 10px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS = {
  check: (c)=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`,
  circle: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57616B" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14171A" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  plusMuted: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  chevL: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  chevR: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>',
  edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  repeat: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#57616B" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>',
  tabTasks: (a)=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${a?'#E8A33D':'#57616B'}" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>`,
  tabFinance: (a)=>`<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${a?'#E8A33D':'#57616B'}" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>`,
};

const LIST_STYLE = {
  prayer: { color: "#3ECF8E", label: "Намаз" },
  deep: { color: "#E8A33D", label: "Глубокая работа" },
  ops: { color: "#5B8FE0", label: "Операционка" },
  admin: { color: "#9B8CD9", label: "Админ" },
  personal: { color: "#E27C9E", label: "Личное" },
};
const PRIORITY_STYLE = { 0: { color: "#57616B", label: "Без приоритета" }, 1: { color: "#5B8FE0", label: "Низкий" }, 2: { color: "#E8A33D", label: "Средний" }, 3: { color: "#E2574C", label: "Высокий" } };

const EXPENSE_CATEGORIES = ["Еда", "Транспорт", "Закупки WB/Ozon", "ЖКХ и связь", "Здоровье", "Развлечения", "Прочее"];
const INCOME_CATEGORIES = ["Продажи WB/Ozon", "Инвестиции", "Прочее доход"];
const CAT_PALETTE = ["#E8A33D", "#5B8FE0", "#3ECF8E", "#E27C9E", "#9B8CD9", "#E2574C", "#57616B", "#4FC3D9", "#C9A94E"];
function catColor(name) {
  const all = [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES];
  const idx = all.indexOf(name);
  return CAT_PALETTE[idx >= 0 ? idx % CAT_PALETTE.length : 0];
}

const DEFAULT_TASKS = [
  { id: "t1", title: "Фаджр", list: "prayer", priority: 0, date: null, time: "05:00", repeat: "daily", done: false, doneDates: [] },
  { id: "t2", title: "Deep work — главный проект", list: "deep", priority: 3, date: null, time: "06:00", repeat: "daily", done: false, doneDates: [] },
  { id: "t3", title: "WB/Ozon: заказы и отгрузки", list: "ops", priority: 2, date: null, time: "07:30", repeat: "daily", done: false, doneDates: [] },
  { id: "t4", title: "Зухр", list: "prayer", priority: 0, date: null, time: "11:30", repeat: "daily", done: false, doneDates: [] },
  { id: "t5", title: "Аср", list: "prayer", priority: 0, date: null, time: "15:00", repeat: "daily", done: false, doneDates: [] },
  { id: "t6", title: "Магриб", list: "prayer", priority: 0, date: null, time: "18:00", repeat: "daily", done: false, doneDates: [] },
  { id: "t7", title: "Разбор дня + план на завтра", list: "admin", priority: 1, date: null, time: "19:30", repeat: "daily", done: false, doneDates: [] },
  { id: "t8", title: "Иша", list: "prayer", priority: 0, date: null, time: "21:30", repeat: "daily", done: false, doneDates: [] },
];

const todayKey = (d = new Date()) => {
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
};
const addDaysStr = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return todayKey(d);
};
const fmtRub = (n) => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
const fmtDateShort = (dateStr) => {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
};

function loadKey(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw !== null ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { console.error("storage error", e); }
}

let state = {
  tab: "tasks",
  tasksView: "list", // list | calendar
  filter: "today",
  calCursor: new Date(),
  selectedDate: todayKey(),
  showAddTask: false,
  editingTaskId: null,
  financeView: "ops", // ops | ledger
  txType: "expense",
  tasks: loadKey("pd-tasks", DEFAULT_TASKS),
  transactions: loadKey("pd-transactions", []),
  finance: loadKey("pd-finance", { credits: [], investments: [], accounts: [] }),
};

function persistTasks() { saveKey("pd-tasks", state.tasks); }
function persistTx() { saveKey("pd-transactions", state.transactions); }
function persistFinance() { saveKey("pd-finance", state.finance); }

function isDoneOn(task, dateStr) {
  return task.repeat === "daily" ? task.doneDates.includes(dateStr) : !!task.done;
}
function taskDisplayDate(task) { return task.repeat === "daily" ? null : task.date; }

function sortTasks(list) {
  return [...list].sort((a, b) => {
    const at = a.time || "99:99", bt = b.time || "99:99";
    if (at !== bt) return at.localeCompare(bt);
    return (b.priority || 0) - (a.priority || 0);
  });
}

function getFilteredTasks(filter) {
  const today = todayKey();
  const weekEnd = addDaysStr(today, 7);
  let list = [];
  if (filter === "today") {
    list = state.tasks.filter(t => t.repeat === "daily" || t.date === today);
  } else if (filter === "week") {
    list = state.tasks.filter(t => t.repeat === "none" && t.date && t.date > today && t.date <= weekEnd);
  } else if (filter === "overdue") {
    list = state.tasks.filter(t => t.repeat === "none" && t.date && t.date < today && !t.done);
  } else if (filter === "inbox") {
    list = state.tasks.filter(t => t.repeat === "none" && !t.date);
  } else {
    list = [...state.tasks];
  }
  return sortTasks(list);
}

function getTasksForDate(dateStr) {
  return sortTasks(state.tasks.filter(t => t.repeat === "daily" || t.date === dateStr));
}

// ---------- Task item render ----------
function taskItemHTML(t, contextDate) {
  const style = LIST_STYLE[t.list] || LIST_STYLE.admin;
  const prio = PRIORITY_STYLE[t.priority] || PRIORITY_STYLE[0];
  const done = isDoneOn(t, contextDate);
  const dispDate = taskDisplayDate(t);
  return `<div class="task" style="border-left:3px solid ${style.color};opacity:${done ? 0.5 : 1};">
    <button class="icon-btn check" data-action="toggle-task" data-id="${t.id}" data-date="${contextDate}">${done ? ICONS.check(style.color) : ICONS.circle}</button>
    <div style="flex:1;min-width:0;" class="task-title-clickable" data-action="open-edit-task" data-id="${t.id}">
      <div class="task-label" style="text-decoration:${done ? 'line-through' : 'none'};">${escapeHtml(t.title)}</div>
      <div class="task-meta">
        <span class="list-badge" style="background:${style.color}22;color:${style.color};">${style.label}</span>
        ${t.priority > 0 ? `<span class="priority-dot" style="background:${prio.color};" title="${prio.label}"></span>` : ""}
        ${t.time ? `<span class="task-time">${t.time}</span>` : ""}
        ${dispDate ? `<span class="task-time">${fmtDateShort(dispDate)}</span>` : ""}
        ${t.repeat === "daily" ? `<span class="repeat-badge">${ICONS.repeat} ежедневно</span>` : ""}
      </div>
    </div>
    <button class="icon-btn" data-action="open-edit-task" data-id="${t.id}" title="Перенести / изменить">${ICONS.edit}</button>
    <button class="icon-btn" data-action="remove-task" data-id="${t.id}">${ICONS.trash}</button>
  </div>`;
}

function addTaskFormHTML(prefilledDate) {
  const listOptions = Object.entries(LIST_STYLE).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
  return `
    <div class="add-row">
      <input class="field" type="text" id="new-task-title" placeholder="Название задачи..." style="flex:1 1 100%;" />
      <input class="field" type="date" id="new-task-date" value="${prefilledDate || ''}" style="flex:1;min-width:120px;" />
      <input class="field" type="time" id="new-task-time" style="width:90px;" />
      <select class="field" id="new-task-list" style="flex:1;min-width:110px;">${listOptions}</select>
      <select class="field" id="new-task-priority" style="flex:1;min-width:110px;">
        <option value="0">Без приоритета</option>
        <option value="1">Низкий</option>
        <option value="2">Средний</option>
        <option value="3">Высокий</option>
      </select>
      <select class="field" id="new-task-repeat" style="flex:1;min-width:110px;">
        <option value="none">Не повторять</option>
        <option value="daily">Каждый день</option>
      </select>
      <button class="btn-add" data-action="submit-task" style="flex-shrink:0;">${ICONS.plus}</button>
    </div>`;
}

// ---------- Tasks tab ----------
function tasksTabHTML() {
  const chips = [
    { key: "today", label: "Сегодня" },
    { key: "week", label: "Неделя" },
    { key: "overdue", label: "Просрочено" },
    { key: "inbox", label: "Входящие" },
    { key: "all", label: "Все" },
  ];

  const viewToggle = `
    <div class="segmented">
      <button data-action="set-tasks-view" data-view="list" class="${state.tasksView === 'list' ? 'active' : ''}">Список</button>
      <button data-action="set-tasks-view" data-view="calendar" class="${state.tasksView === 'calendar' ? 'active' : ''}">Календарь</button>
    </div>`;

  if (state.tasksView === "calendar") {
    return viewToggle + calendarBlockHTML();
  }

  const chipRow = `<div class="chip-row">${chips.map(c => `<button class="chip ${state.filter === c.key ? 'active' : ''}" data-action="set-filter" data-filter="${c.key}">${c.label}</button>`).join("")}</div>`;
  const filtered = getFilteredTasks(state.filter);
  const contextDate = todayKey();
  const items = filtered.length === 0
    ? `<div class="empty-state">Пусто. Самое время добавить задачу.</div>`
    : filtered.map(t => taskItemHTML(t, t.repeat === "daily" ? contextDate : (t.date || contextDate))).join("");

  const addBlock = state.showAddTask
    ? addTaskFormHTML(state.filter === "today" ? todayKey() : "")
    : `<button class="toggle-add-btn" data-action="toggle-add-task">${ICONS.plusMuted} Добавить задачу</button>`;

  return `${viewToggle}${chipRow}<div>${items}</div>${addBlock}`;
}

function calendarBlockHTML() {
  const cursor = state.calCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = cursor.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const isToday = dateStr === todayKey();
    const isSelected = dateStr === state.selectedDate;
    const dayTasks = state.tasks.filter(t => t.repeat === "daily" || t.date === dateStr);
    const dots = dayTasks.slice(0, 4).map(t => `<span class="cal-dot" style="background:${(LIST_STYLE[t.list] || LIST_STYLE.admin).color};"></span>`).join("");
    cells += `<button class="cal-cell${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-action="select-date" data-date="${dateStr}">
      <span>${d}</span><span class="cal-dots">${dots}</span>
    </button>`;
  }

  const dayTasks = getTasksForDate(state.selectedDate);
  const items = dayTasks.length === 0
    ? `<div class="empty-state">На этот день ничего не запланировано.</div>`
    : dayTasks.map(t => taskItemHTML(t, state.selectedDate)).join("");

  const addBlock = state.showAddTask
    ? addTaskFormHTML(state.selectedDate)
    : `<button class="toggle-add-btn" data-action="toggle-add-task">${ICONS.plusMuted} Добавить на ${fmtDateShort(state.selectedDate)}</button>`;

  return `
    <div class="cal-nav">
      <button data-action="cal-prev">${ICONS.chevL}</button>
      <h2 class="section-title" style="text-transform:capitalize;font-size:15px;">${monthLabel}</h2>
      <button data-action="cal-next">${ICONS.chevR}</button>
    </div>
    <div class="cal-grid">
      ${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    <h3 style="font-family:'Space Grotesk',sans-serif;font-size:13px;color:#8B95A1;margin:16px 0 4px;">${fmtDateShort(state.selectedDate)}</h3>
    <div>${items}</div>
    ${addBlock}
  `;
}

// ---------- Edit / reschedule task modal ----------
function taskEditModalHTML(t) {
  const listOptions = Object.entries(LIST_STYLE).map(([k, v]) => `<option value="${k}" ${t.list===k?'selected':''}>${v.label}</option>`).join("");
  const priorityOptions = [0,1,2,3].map(p => `<option value="${p}" ${t.priority===p?'selected':''}>${PRIORITY_STYLE[p].label}</option>`).join("");
  return `
  <div class="modal-backdrop" data-action="close-edit-task">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <h3>Изменить задачу</h3>
      <input class="field" type="text" id="edit-task-title" value="${escapeHtml(t.title)}" placeholder="Название задачи" />

      <div class="modal-field-label">Перенести быстро</div>
      <div class="quick-date-row">
        <button class="quick-date-chip" data-action="quick-date" data-choice="today">Сегодня</button>
        <button class="quick-date-chip" data-action="quick-date" data-choice="tomorrow">Завтра</button>
        <button class="quick-date-chip" data-action="quick-date" data-choice="nextweek">+7 дней</button>
        <button class="quick-date-chip" data-action="quick-date" data-choice="clear">Без даты</button>
      </div>

      <div class="modal-field-label">Дата и время</div>
      <div style="display:flex;gap:6px;">
        <input class="field" type="date" id="edit-task-date" value="${t.date || ''}" style="flex:1;" />
        <input class="field" type="time" id="edit-task-time" value="${t.time || ''}" style="width:100px;" />
      </div>

      <div class="modal-field-label">Список</div>
      <select class="field" id="edit-task-list">${listOptions}</select>

      <div class="modal-field-label">Приоритет</div>
      <select class="field" id="edit-task-priority">${priorityOptions}</select>

      <div class="modal-field-label">Повтор</div>
      <select class="field" id="edit-task-repeat">
        <option value="none" ${t.repeat==='none'?'selected':''}>Не повторять</option>
        <option value="daily" ${t.repeat==='daily'?'selected':''}>Каждый день</option>
      </select>

      <div class="modal-actions">
        <button class="btn-cancel" data-action="close-edit-task">Отмена</button>
        <button class="btn-delete" data-action="remove-task" data-id="${t.id}">Удалить</button>
        <button class="btn-save" data-action="save-edit-task" data-id="${t.id}">Сохранить</button>
      </div>
    </div>
  </div>`;
}

// ---------- Finance: Operations (CoinKeeper-style) ----------
function financeOpsHTML() {
  const today = todayKey();
  const monthPrefix = today.slice(0, 7);
  const monthTx = state.transactions.filter(tx => tx.date && tx.date.startsWith(monthPrefix));
  const income = monthTx.filter(t => t.type === "income").reduce((s, t) => s + Number(t.amount || 0), 0);
  const expense = monthTx.filter(t => t.type === "expense").reduce((s, t) => s + Number(t.amount || 0), 0);
  const net = income - expense;

  const byCat = {};
  monthTx.filter(t => t.type === "expense").forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + Number(t.amount || 0); });
  const catEntries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = catEntries.length ? catEntries[0][1] : 1;

  const catBars = catEntries.length === 0
    ? `<div class="empty-state">Пока нет расходов в этом месяце.</div>`
    : catEntries.map(([cat, sum]) => `
        <div class="cat-bar-item">
          <div class="cat-bar-head"><span>${escapeHtml(cat)}</span><span class="mono muted">${fmtRub(sum)}</span></div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(sum / maxCat) * 100}%;background:${catColor(cat)};"></div></div>
        </div>`).join("");

  const catOptions = (state.txType === "expense" ? EXPENSE_CATEGORIES : INCOME_CATEGORIES)
    .map(c => `<option value="${c}">${c}</option>`).join("");

  const recent = [...state.transactions].sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id)).slice(0, 15);
  const recentHTML = recent.length === 0
    ? `<div class="empty-state">Операций пока нет — добавьте первую ниже.</div>`
    : recent.map(tx => `
        <div class="tx-item">
          <div class="tx-cat-dot" style="background:${catColor(tx.category)};"></div>
          <div class="tx-info">
            <div class="tx-cat">${escapeHtml(tx.category)}</div>
            ${tx.note ? `<div class="tx-note">${escapeHtml(tx.note)}</div>` : ""}
            <div class="tx-date">${fmtDateShort(tx.date)}</div>
          </div>
          <div class="tx-amount" style="color:${tx.type === 'income' ? '#3ECF8E' : '#E2574C'};">${tx.type === 'income' ? '+' : '−'}${fmtRub(tx.amount)}</div>
          <button class="icon-btn" data-action="remove-tx" data-id="${tx.id}">${ICONS.trash}</button>
        </div>`).join("");

  return `
    <div class="summary-grid">
      <div><div class="stat-label">Баланс месяца</div><div class="stat-value big mono" style="color:${net >= 0 ? '#3ECF8E' : '#E2574C'}">${fmtRub(net)}</div></div>
      <div><div class="stat-label">Доход</div><div class="stat-value mono" style="color:#3ECF8E">${fmtRub(income)}</div></div>
      <div><div class="stat-label">Расход</div><div class="stat-value mono" style="color:#E2574C">${fmtRub(expense)}</div></div>
      <div><div class="stat-label">Операций</div><div class="stat-value mono">${monthTx.length}</div></div>
    </div>

    <div class="fin-section">
      <div class="fin-title"><h3>По категориям (расходы, этот месяц)</h3></div>
      ${catBars}
    </div>

    <div class="fin-section">
      <div class="fin-title"><h3>Добавить операцию</h3></div>
      <div class="type-toggle">
        <button class="${state.txType === 'expense' ? 'active expense' : ''}" data-action="set-tx-type" data-type="expense">Расход</button>
        <button class="${state.txType === 'income' ? 'active income' : ''}" data-action="set-tx-type" data-type="income">Доход</button>
      </div>
      <div class="add-row">
        <input class="field" type="number" id="new-tx-amount" placeholder="Сумма ₽" style="flex:1;min-width:100px;" />
        <select class="field" id="new-tx-category" style="flex:1;min-width:130px;">${catOptions}</select>
        <input class="field" type="date" id="new-tx-date" value="${today}" style="flex:1;min-width:120px;" />
        <input class="field" type="text" id="new-tx-note" placeholder="Заметка (необязательно)" style="flex:1 1 100%;" />
        <button class="btn-add" data-action="add-tx">${ICONS.plus}</button>
      </div>
    </div>

    <div class="fin-section">
      <div class="fin-title"><h3>Последние операции</h3></div>
      ${recentHTML}
    </div>
  `;
}

// ---------- Finance: Ledger (credits / investments / accounts) ----------
function financeLedgerHTML() {
  const { credits, investments, accounts } = state.finance;
  const totalDebt = credits.reduce((s, c) => s + Number(c.balance || 0), 0);
  const totalMonthly = credits.reduce((s, c) => s + Number(c.payment || 0), 0);
  const portfolioValue = investments.reduce((s, i) => s + Number(i.qty || 0) * Number(i.price || 0), 0);
  const portfolioCost = investments.reduce((s, i) => s + Number(i.qty || 0) * Number(i.avgPrice || 0), 0);
  const pnl = portfolioValue - portfolioCost;
  const totalAccounts = accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
  const netWorth = totalAccounts + portfolioValue - totalDebt;

  const finRow = (section, row, fields) => `
    <div class="fin-row" data-row-id="${row.id}" data-section="${section}">
      ${fields.map(f => `<input class="field" type="${f.type}" placeholder="${f.placeholder}" value="${escapeHtml(String(row[f.key] ?? ''))}" data-field="${f.key}" data-action="update-fin" data-section="${section}" data-id="${row.id}" style="flex:${f.flex};" />`).join("")}
      <button class="icon-btn" data-action="remove-fin" data-section="${section}" data-id="${row.id}">${ICONS.trash}</button>
    </div>`;

  return `
    <div class="summary-grid">
      <div><div class="stat-label">Чистая позиция</div><div class="stat-value big mono" style="color:${netWorth >= 0 ? '#3ECF8E' : '#E2574C'}">${fmtRub(netWorth)}</div></div>
      <div><div class="stat-label">Долг всего</div><div class="stat-value mono" style="color:#E2574C">${fmtRub(totalDebt)}</div></div>
      <div><div class="stat-label">Платежи/мес</div><div class="stat-value mono" style="color:#E8A33D">${fmtRub(totalMonthly)}</div></div>
      <div><div class="stat-label">Портфель</div><div class="stat-value mono" style="color:#5B8FE0">${fmtRub(portfolioValue)}</div></div>
    </div>

    <div class="fin-section">
      <div class="fin-title">💳<h3>Кредиты</h3></div>
      ${credits.map(r => finRow("credits", r, [
        { key: "name", placeholder: "Название", type: "text", flex: 2 },
        { key: "balance", placeholder: "Остаток ₽", type: "number", flex: 1 },
        { key: "payment", placeholder: "Платёж/мес ₽", type: "number", flex: 1 },
      ])).join("")}
      <button class="btn-add btn-add-labeled" data-action="add-credit">${ICONS.plus}<span>Добавить</span></button>
    </div>

    <div class="fin-section">
      <div class="fin-title">📈<h3>Акции / инвестиции</h3></div>
      ${investments.map(r => finRow("investments", r, [
        { key: "ticker", placeholder: "Тикер", type: "text", flex: 1 },
        { key: "qty", placeholder: "Кол-во", type: "number", flex: 1 },
        { key: "avgPrice", placeholder: "Ср. цена", type: "number", flex: 1 },
        { key: "price", placeholder: "Тек. цена", type: "number", flex: 1 },
      ])).join("")}
      ${investments.length > 0 ? `<div class="mono" style="font-size:12px;margin-top:4px;color:${pnl >= 0 ? '#3ECF8E' : '#E2574C'}">${pnl >= 0 ? '+' : ''}${fmtRub(pnl)}</div>` : ""}
      <button class="btn-add btn-add-labeled" data-action="add-investment">${ICONS.plus}<span>Добавить</span></button>
    </div>

    <div class="fin-section">
      <div class="fin-title">👛<h3>Остатки на счетах</h3></div>
      ${accounts.map(r => finRow("accounts", r, [
        { key: "name", placeholder: "Счёт / карта", type: "text", flex: 2 },
        { key: "balance", placeholder: "Остаток ₽", type: "number", flex: 1 },
      ])).join("")}
      <button class="btn-add btn-add-labeled" data-action="add-account">${ICONS.plus}<span>Добавить</span></button>
    </div>
  `;
}

function financeTabHTML() {
  const viewToggle = `
    <div class="segmented">
      <button data-action="set-finance-view" data-view="ops" class="${state.financeView === 'ops' ? 'active' : ''}">Операции</button>
      <button data-action="set-finance-view" data-view="ledger" class="${state.financeView === 'ledger' ? 'active' : ''}">Кредиты и счета</button>
    </div>`;
  return viewToggle + (state.financeView === "ops" ? financeOpsHTML() : financeLedgerHTML());
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

// ---------- Root render ----------
function render() {
  const app = document.getElementById("app");
  const now = new Date();
  const dateLabel = now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });

  const tabContent = state.tab === "tasks" ? tasksTabHTML() : financeTabHTML();
  const editingTask = state.editingTaskId ? state.tasks.find(t => t.id === state.editingTaskId) : null;

  app.innerHTML = `
    <header>
      <div class="eyebrow"><span>${dateLabel}</span></div>
      <h1>Панель дня</h1>
    </header>
    <main>${tabContent}</main>
    <nav class="tabbar"><div class="inner">
      <button data-action="set-tab" data-tab="tasks">${ICONS.tabTasks(state.tab==='tasks')}<span style="color:${state.tab==='tasks'?'#E8A33D':'#57616B'}">Задачи</span></button>
      <button data-action="set-tab" data-tab="finance">${ICONS.tabFinance(state.tab==='finance')}<span style="color:${state.tab==='finance'?'#E8A33D':'#57616B'}">Финансы</span></button>
    </div></nav>
    ${editingTask ? taskEditModalHTML(editingTask) : ""}
  `;
}

// ---------- Event delegation ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "set-tab") { state.tab = el.dataset.tab; state.showAddTask = false; render(); }
  else if (action === "set-tasks-view") { state.tasksView = el.dataset.view; state.showAddTask = false; render(); }
  else if (action === "set-filter") { state.filter = el.dataset.filter; state.showAddTask = false; render(); }
  else if (action === "set-finance-view") { state.financeView = el.dataset.view; render(); }
  else if (action === "set-tx-type") { state.txType = el.dataset.type; render(); }
  else if (action === "toggle-add-task") { state.showAddTask = !state.showAddTask; render(); }

  else if (action === "toggle-task") {
    const id = el.dataset.id, ctxDate = el.dataset.date;
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    if (t.repeat === "daily") {
      t.doneDates = t.doneDates.includes(ctxDate) ? t.doneDates.filter(d => d !== ctxDate) : [...t.doneDates, ctxDate];
    } else {
      t.done = !t.done;
    }
    persistTasks(); render();
  }
  else if (action === "remove-task") {
    state.tasks = state.tasks.filter(t => t.id !== el.dataset.id);
    if (state.editingTaskId === el.dataset.id) state.editingTaskId = null;
    persistTasks(); render();
  }
  else if (action === "open-edit-task") { state.editingTaskId = el.dataset.id; render(); }
  else if (action === "close-edit-task") { state.editingTaskId = null; render(); }
  else if (action === "quick-date") {
    const choice = el.dataset.choice;
    const dateInput = document.getElementById("edit-task-date");
    const repeatSelect = document.getElementById("edit-task-repeat");
    if (choice === "clear") { dateInput.value = ""; }
    else {
      if (repeatSelect.value === "daily") repeatSelect.value = "none";
      if (choice === "today") dateInput.value = todayKey();
      else if (choice === "tomorrow") dateInput.value = addDaysStr(todayKey(), 1);
      else if (choice === "nextweek") dateInput.value = addDaysStr(todayKey(), 7);
    }
  }
  else if (action === "save-edit-task") {
    const id = el.dataset.id;
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    const title = document.getElementById("edit-task-title").value.trim();
    if (!title) return;
    const repeat = document.getElementById("edit-task-repeat").value;
    t.title = title;
    t.date = repeat === "daily" ? null : (document.getElementById("edit-task-date").value || null);
    t.time = document.getElementById("edit-task-time").value || null;
    t.list = document.getElementById("edit-task-list").value;
    t.priority = Number(document.getElementById("edit-task-priority").value);
    t.repeat = repeat;
    persistTasks();
    state.editingTaskId = null;
    render();
  }
  else if (action === "submit-task") {
    const title = document.getElementById("new-task-title").value.trim();
    if (!title) return;
    const date = document.getElementById("new-task-date").value || null;
    const time = document.getElementById("new-task-time").value || null;
    const list = document.getElementById("new-task-list").value;
    const priority = Number(document.getElementById("new-task-priority").value);
    const repeat = document.getElementById("new-task-repeat").value;
    state.tasks.push({ id: "c" + Date.now(), title, list, priority, date: repeat === "daily" ? null : date, time, repeat, done: false, doneDates: [] });
    persistTasks();
    state.showAddTask = false;
    render();
  }

  else if (action === "cal-prev") { state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()-1, 1); render(); }
  else if (action === "cal-next") { state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()+1, 1); render(); }
  else if (action === "select-date") { state.selectedDate = el.dataset.date; state.showAddTask = false; render(); }

  else if (action === "add-tx") {
    const amount = Number(document.getElementById("new-tx-amount").value);
    if (!amount || amount <= 0) return;
    const category = document.getElementById("new-tx-category").value;
    const date = document.getElementById("new-tx-date").value || todayKey();
    const note = document.getElementById("new-tx-note").value.trim();
    state.transactions.push({ id: "tx" + Date.now(), type: state.txType, amount, category, date, note });
    persistTx(); render();
  }
  else if (action === "remove-tx") {
    state.transactions = state.transactions.filter(t => t.id !== el.dataset.id);
    persistTx(); render();
  }

  else if (action === "add-credit") { state.finance.credits.push({ id: "r"+Date.now(), name:"", balance:"", payment:"" }); persistFinance(); render(); }
  else if (action === "add-investment") { state.finance.investments.push({ id: "r"+Date.now(), ticker:"", qty:"", avgPrice:"", price:"" }); persistFinance(); render(); }
  else if (action === "add-account") { state.finance.accounts.push({ id: "r"+Date.now(), name:"", balance:"" }); persistFinance(); render(); }
  else if (action === "remove-fin") {
    const { section, id } = el.dataset;
    state.finance[section] = state.finance[section].filter(r => r.id !== id);
    persistFinance(); render();
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action === "update-fin") {
    const { section, id, field } = el.dataset;
    state.finance[section] = state.finance[section].map(r => r.id === id ? { ...r, [field]: el.value } : r);
    persistFinance();
  }
});

(function setupManifest() {
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="96" fill="#14171A"/>
    <rect x="96" y="376" width="320" height="24" rx="12" fill="#262C31"/>
    <rect x="96" y="376" width="220" height="24" rx="12" fill="#E8A33D"/>
    <circle cx="256" cy="196" r="88" fill="none" stroke="#3ECF8E" stroke-width="16"/>
    <path d="M256 140 L256 196 L296 226" stroke="#3ECF8E" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
  const iconDataUri = "data:image/svg+xml;base64," + btoa(iconSvg);
  const manifest = {
    name: "Панель дня", short_name: "Панель дня", start_url: ".", display: "standalone",
    background_color: "#14171A", theme_color: "#14171A",
    icons: [{ src: iconDataUri, sizes: "any", type: "image/svg+xml", purpose: "any maskable" }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
  document.getElementById("manifest-link").setAttribute("href", URL.createObjectURL(blob));
})();

render();
</script>
</body>
</html>
