<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Панель дня</title>
<meta name="theme-color" content="#14171A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Панель дня" />
<link rel="manifest" id="manifest-link" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #14171A; color: #EDEFF1; font-family: 'Inter', sans-serif; }
  input, select, button, textarea { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, button:focus-visible, textarea:focus { outline: 2px solid #E8A33D !important; outline-offset: 1px; }
  input::placeholder, textarea::placeholder { color: #57616B; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  button { cursor: pointer; }
  ::-webkit-scrollbar { display: none; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 16px 12px; border-bottom: 1px solid #1F2429; }
  .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; color: #8B95A1; text-transform: capitalize; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0; letter-spacing: -0.3px; }
  main { flex: 1; padding: 16px; padding-bottom: 90px; max-width: 480px; width: 100%; margin: 0 auto; }

  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 17px; margin: 0; color: #EDEFF1; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .muted { color: #8B95A1; }

  /* Segmented control */
  .segmented { display: flex; gap: 4px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; padding: 3px; margin-bottom: 14px; }
  .segmented button { flex: 1; background: none; border: none; border-radius: 6px; padding: 8px 4px; font-size: 12px; color: #8B95A1; font-weight: 500; }
  .segmented button.active { background: #20252A; color: #EDEFF1; }

  /* Filter chips */
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; }
  .chip { flex-shrink: 0; padding: 7px 13px; border-radius: 16px; border: 1px solid #262C31; background: #1B1F23; color: #8B95A1; font-size: 12px; white-space: nowrap; }
  .chip.active { background: #E8A33D; color: #14171A; border-color: #E8A33D; font-weight: 600; }

  /* Task items */
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; margin-top: 6px; }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .task-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8B95A1; }
  .task-label { flex: 1; font-size: 14px; color: #EDEFF1; line-height: 1.35; }
  .icon-btn { background: none; border: none; display: flex; padding: 2px; opacity: 0.6; flex-shrink: 0; }
  .icon-btn.check { opacity: 1; margin-top: 1px; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .list-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .repeat-badge { font-size: 10px; color: #57616B; display: flex; align-items: center; gap: 3px; }
  .streak-badge { font-size: 10px; color: #E8A33D; display: flex; align-items: center; gap: 2px; font-weight: 600; }
  .empty-state { font-size: 13px; color: #57616B; padding: 24px 4px; text-align: center; }

  .add-row { display: flex; gap: 6px; margin-top: 12px; padding: 10px; background: #1B1F23; border: 1px dashed #2A3036; border-radius: 8px; flex-wrap: wrap; }
  .field { background: #14171A; border: 1px solid #2A3036; border-radius: 6px; padding: 8px 10px; font-size: 13px; color: #EDEFF1; outline: none; }
  .btn-add { background: #E8A33D; border: none; border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-add-labeled { display: flex; align-items: center; gap: 4px; padding: 6px 12px; margin-top: 8px; }
  .btn-add-labeled span { font-size: 12px; color: #14171A; font-weight: 600; }
  .toggle-add-btn { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: #1B1F23; border: 1px dashed #2A3036; border-radius: 8px; color: #8B95A1; font-size: 13px; width: 100%; margin-top: 12px; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button { background: none; border: none; display: flex; padding: 4px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 10px; color: #57616B; padding-bottom: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 8px; border: 1px solid #262C31; background: #1B1F23; color: #EDEFF1; font-size: 12px; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; gap: 2px; }
  .cal-cell.today { border-color: #E8A33D; }
  .cal-cell.selected { background: #20252A; border-color: #5B8FE0; }
  .cal-dots { display: flex; gap: 2px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }

  /* Summary grid (finance) */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #1B1F23; border: 1px solid #262C31; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .stat-label { font-size: 11px; color: #8B95A1; margin-bottom: 2px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }
  .stat-value.big { font-size: 19px; }

  .fin-section { margin-bottom: 18px; }
  .fin-title { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .fin-title h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; margin: 0; color: #EDEFF1; }
  .fin-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .fin-row input, .fin-row select { flex: 1; min-width: 90px; }

  /* Transactions */
  .type-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
  .type-toggle button { flex: 1; padding: 9px; border-radius: 6px; border: 1px solid #262C31; background: #1B1F23; color: #8B95A1; font-size: 13px; font-weight: 600; }
  .type-toggle button.active.expense { background: #E2574C; color: #fff; border-color: #E2574C; }
  .type-toggle button.active.income { background: #3ECF8E; color: #14171A; border-color: #3ECF8E; }

  .tx-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; margin-top: 6px; }
  .tx-cat-dot { width: 4px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 13px; color: #EDEFF1; }
  .tx-note { font-size: 11px; color: #57616B; margin-top: 1px; }
  .tx-date { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #57616B; }
  .tx-amount { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 14px; flex-shrink: 0; }

  .cat-bar-item { margin-top: 10px; }
  .cat-bar-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .cat-bar-track { height: 7px; background: #20252A; border-radius: 4px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 4px; }

  /* Edit task modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .modal-sheet { width: 100%; max-width: 480px; background: #1B1F23; border-top: 1px solid #262C31; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow-y: auto; }
  .modal-sheet h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin: 0 0 12px; }
  .modal-field-label { font-size: 11px; color: #8B95A1; margin: 10px 0 4px; }
  .modal-sheet .field { width: 100%; }
  .quick-date-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .quick-date-chip { padding: 6px 12px; border-radius: 14px; border: 1px solid #262C31; background: #14171A; color: #8B95A1; font-size: 12px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; }
  .btn-save { background: #E8A33D; color: #14171A; }
  .btn-delete { background: #2A1F20; color: #E2574C; border: 1px solid #3A2427 !important; }
  .btn-cancel { background: #20252A; color: #8B95A1; border: 1px solid #262C31 !important; }
  .task-title-clickable { cursor: pointer; }

  /* Notebook */
  .note-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .note-nav .icon-nav { background: none; border: none; display: flex; padding: 6px; flex-shrink: 0; }
  .note-date-label { font-family: 'Space Grotesk', sans-serif; font-size: 15px; text-align: center; }
  .note-today-btn { padding: 7px 13px; border-radius: 14px; border: 1px solid #262C31; background: #1B1F23; color: #8B95A1; font-size: 12px; flex-shrink: 0; }
  .note-textarea { width: 100%; min-height: 220px; background: #1B1F23; border: 1px solid #262C31; border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.55; color: #EDEFF1; resize: vertical; }
  .note-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11px; color: #57616B; }
  .note-search { width: 100%; margin-bottom: 12px; }
  .note-list-item { padding: 10px 12px; background: #1B1F23; border: 1px solid #262C31; border-radius: 8px; margin-top: 6px; }
  .note-list-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #E8A33D; margin-bottom: 3px; text-transform: capitalize; }
  .note-list-snippet { font-size: 13px; color: #EDEFF1; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .note-list-time { font-size: 10px; color: #57616B; margin-top: 4px; }

  nav.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #1B1F23; border-top: 1px solid #262C31; display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabbar .inner { display: flex; max-width: 480px; width: 100%; }
  nav.tabbar button { flex: 1; background: none; border: none; padding: 10px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabbar button span { font-size: 9px; }
</style>

window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app) app.innerHTML = '<div style="padding:20px;color:#E2574C;font-family:monospace;font-size:12px;white-space:pre-wrap;">ОШИБКА JS:\n' + (e.message || '') + '\nфайл: ' + (e.filename || '') + '\nстрока: ' + (e.lineno || '') + ':' + (e.colno || '') + '</div>';
});
window.addEventListener('unhandledrejection', function(e) {
  var app = document.getElementById('app');

function catColor(name) {
  const all = [...EXPENSE_CATEGORIES, ...INCOME_CATEGORIES];
  const idx = all.indexOf(name);
  return CAT_PALETTE[idx >= 0 ? idx % CAT_PALETTE.length : 0];
}

const todayKey = (d = new Date()) => {
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
};
const addDaysStr = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return todayKey(d);
};
const fmtRub = (n) => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + " ₽";
const fmtDateShort = (dateStr) => {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
};

const XP_PER_LEVEL = 10;
function levelInfo(totalCompletions) {
  const level = Math.floor(totalCompletions / XP_PER_LEVEL) + 1;
  const inLevel = totalCompletions % XP_PER_LEVEL;
  return { level, inLevel, needed: XP_PER_LEVEL, pct: Math.round((inLevel / XP_PER_LEVEL) * 100) };
}

];
function todayFact() {
  const dayOfYear = Math.floor((new Date(todayKey()) - new Date(todayKey().slice(0,4) + "-01-01")) / 86400000);
  return HABIT_FACTS[dayOfYear % HABIT_FACTS.length];
}

function addInterval(dateStr, repeat) {
  const d = new Date(dateStr + "T00:00:00");
  if (repeat === "weekly") d.setDate(d.getDate() + 7);
  else if (repeat === "monthly") d.setMonth(d.getMonth() + 1);
  else if (repeat === "yearly") d.setFullYear(d.getFullYear() + 1);
  return todayKey(d);
}
function advancePastPayments() {
  let changed = false;
  state.finance.payments.forEach(p => {
    if (p.repeat === "once" || !p.nextDate) return;
    while (p.nextDate < todayKey()) { p.nextDate = addInterval(p.nextDate, p.repeat); changed = true; }
  });
  if (changed) persistFinance();
}

function loadKey(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw !== null ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { console.error("storage error", e); }
}

function isDoneOn(task, dateStr) {
  return task.repeat === "daily" ? task.doneDates.includes(dateStr) : !!task.done;
}
function isFrozenOn(task, dateStr) {
  return task.repeat === "daily" && (task.frozenDates || []).includes(dateStr);
}
function taskStreak(task) {
  if (task.repeat !== "daily") return 0;
  let streak = 0;
  let cursor = todayKey();
  // if today not done/frozen yet, start counting from yesterday (today still "in progress")
  if (!isDoneOn(task, cursor) && !isFrozenOn(task, cursor)) {
    cursor = addDaysStr(cursor, -1);
  }
  while (isDoneOn(task, cursor) || isFrozenOn(task, cursor)) {
    if (!isFrozenOn(task, cursor)) streak++;
    cursor = addDaysStr(cursor, -1);
  }
  return streak;
}
function taskDisplayDate(task) { return task.repeat === "daily" ? null : task.date; }

function sortTasks(list) {
  return [...list].sort((a, b) => {
    const at = a.time || "99:99", bt = b.time || "99:99";
    if (at !== bt) return at.localeCompare(bt);
    return (b.priority || 0) - (a.priority || 0);
  });
}

function getFilteredTasks(filter) {
  const today = todayKey();
  const weekEnd = addDaysStr(today, 7);
  let list = [];
  if (filter === "today") {
    list = state.tasks.filter(t => t.repeat === "daily" || t.date === today);
  } else if (filter === "week") {
    list = state.tasks.filter(t => t.repeat === "none" && t.date && t.date > today && t.date <= weekEnd);
  } else if (filter === "overdue") {
    list = state.tasks.filter(t => t.repeat === "none" && t.date && t.date < today && !t.done);
  } else if (filter === "inbox") {
    list = state.tasks.filter(t => t.repeat === "none" && !t.date);
  } else {
    list = [...state.tasks];
  }
  return sortTasks(list);
}

function getTasksForDate(dateStr) {
  return sortTasks(state.tasks.filter(t => t.repeat === "daily" || t.date === dateStr));
}

function calendarBlockHTML() {
  const cursor = state.calCursor;
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthLabel = cursor.toLocaleDateString("ru-RU", { month: "long", year: "numeric" });

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const isToday = dateStr === todayKey();
    const isSelected = dateStr === state.selectedDate;
    const dayTasks = state.tasks.filter(t => t.repeat === "daily" || t.date === dateStr);
    const dots = dayTasks.slice(0, 4).map(t => `<span class="cal-dot" style="background:${(LIST_STYLE[t.list] || LIST_STYLE.admin).color};"></span>`).join("");
    cells += `<button class="cal-cell${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-action="select-date" data-date="${dateStr}">
      <span>${d}</span><span class="cal-dots">${dots}</span>
    </button>`;
  }

  const dayTasks = getTasksForDate(state.selectedDate);
  const items = dayTasks.length === 0
    ? `<div class="empty-state">На этот день ничего не запланировано.</div>`
    : dayTasks.map(t => taskItemHTML(t, state.selectedDate)).join("");

  const addBlock = state.showAddTask
    ? addTaskFormHTML(state.selectedDate)
    : `<button class="toggle-add-btn" data-action="toggle-add-task">${ICONS.plusMuted} Добавить на ${fmtDateShort(state.selectedDate)}</button>`;

  return `
    <div class="cal-nav">
      <button data-action="cal-prev">${ICONS.chevL}</button>
      <h2 class="section-title" style="text-transform:capitalize;font-size:15px;">${monthLabel}</h2>
      <button data-action="cal-next">${ICONS.chevR}</button>

    </div>
    <h3 style="font-family:'Space Grotesk',sans-serif;font-size:13px;color:#8B95A1;margin:16px 0 4px;">${fmtDateShort(state.selectedDate)}</h3>
    <div>${items}</div>

  `;
}

// ---------- Finance: Ledger (credits / investments / accounts) ----------
function financeLedgerHTML() {
  const { credits, investments, accounts, debts, payments } = state.finance;
  const totalDebt = credits.reduce((s, c) => s + Number(c.balance || 0), 0);
  const totalMonthly = credits.reduce((s, c) => s + Number(c.payment || 0), 0);
  const portfolioValue = investments.reduce((s, i) => s + Number(i.qty || 0) * Number(i.price || 0), 0);
  const portfolioCost = investments.reduce((s, i) => s + Number(i.qty || 0) * Number(i.avgPrice || 0), 0);
  const pnl = portfolioValue - portfolioCost;
  const totalAccounts = accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
  const totalIOwe = debts.filter(d => d.direction === "i_owe").reduce((s, d) => s + Number(d.amount || 0), 0);
  const totalOwedToMe = debts.filter(d => d.direction === "owed_to_me").reduce((s, d) => s + Number(d.amount || 0), 0);
  const netWorth = totalAccounts + portfolioValue + totalOwedToMe - totalDebt - totalIOwe;

  const finRow = (section, row, fields) => `
    <div class="fin-row" data-row-id="${row.id}" data-section="${section}">

          return `<select class="field" data-field="${f.key}" data-action="update-fin" data-section="${section}" data-id="${row.id}" style="flex:${f.flex};">
            ${f.options.map(o => `<option value="${o.value}" ${row[f.key] === o.value ? "selected" : ""}>${o.label}</option>`).join("")}

// ---------- Statistics ----------
function statsRangeDates(range) {
  const today = todayKey();
  if (range === "week") {
    return Array.from({ length: 7 }, (_, i) => addDaysStr(today, i - 6));
  } else if (range === "month") {
    return Array.from({ length: 30 }, (_, i) => addDaysStr(today, i - 29));
  } else {
    return Array.from({ length: 12 }, (_, i) => {
      const d = new Date();
      d.setMonth(d.getMonth() - (11 - i));
      return d.toISOString().slice(0, 7);
    });
  }
}

function dailyCompletionPct(dateStr) {
  const dailyTasks = state.tasks.filter(t => t.repeat === "daily");
  if (dailyTasks.length === 0) return 0;
  const done = dailyTasks.filter(t => isDoneOn(t, dateStr) || isFrozenOn(t, dateStr)).length;
  return Math.round((done / dailyTasks.length) * 100);
}

function monthCompletionPct(monthStr) {
  const [y, m] = monthStr.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let sum = 0, count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${monthStr}-${String(d).padStart(2, "0")}`;
    if (ds > todayKey()) continue;
    sum += dailyCompletionPct(ds); count++;
  }
  return count > 0 ? Math.round(sum / count) : 0;
}

function statsTabHTML() {
  const range = state.statsRange;
  const rangeToggle = `
    <div class="segmented">
      <button data-action="set-stats-range" data-range="week" class="${range === 'week' ? 'active' : ''}">Неделя</button>
      <button data-action="set-stats-range" data-range="month" class="${range === 'month' ? 'active' : ''}">Месяц</button>
      <button data-action="set-stats-range" data-range="year" class="${range === 'year' ? 'active' : ''}">Год</button>
    </div>`;

  const dates = statsRangeDates(range);
  let bars, labels, avg;
  if (range === "year") {
    const values = dates.map(m => monthCompletionPct(m));
    avg = values.length ? Math.round(values.reduce((a,b)=>a+b,0) / values.length) : 0;
    labels = dates.map(m => new Date(m + "-01").toLocaleDateString("ru-RU", { month: "short" }));
    bars = values;
  } else {
    const values = dates.map(d => dailyCompletionPct(d));
    avg = values.length ? Math.round(values.reduce((a,b)=>a+b,0) / values.length) : 0;
    labels = dates.map(d => range === "week" ? new Date(d+"T00:00:00").toLocaleDateString("ru-RU",{weekday:"short"}) : new Date(d+"T00:00:00").getDate().toString());
    bars = values;
  }

  const chartHTML = `
    <div style="display:flex;align-items:flex-end;gap:${range==='month'?'2px':'6px'};height:120px;padding:8px 0;">
      ${bars.map((v, i) => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;">
          <div style="width:100%;max-width:${range==='month'?'8px':'22px'};height:${Math.max(2, v)}%;background:${v >= 70 ? '#3ECF8E' : v >= 40 ? '#E8A33D' : '#57616B'};border-radius:3px;"></div>
          ${range !== 'month' ? `<span style="font-size:9px;color:#57616B;">${labels[i]}</span>` : ''}
        </div>`).join("")}
    </div>`;

  const bestStreak = Math.max(0, ...state.tasks.filter(t => t.repeat === "daily").map(t => taskStreak(t)));
  const totalCompletions = state.gamify.totalCompletions;

  const dailyTasks = state.tasks.filter(t => t.repeat === "daily");
  const topHabits = [...dailyTasks].map(t => {
    const relevantDates = range === "year" ? statsRangeDates("month") : dates;
    const done = relevantDates.filter(d => isDoneOn(t, d) || isFrozenOn(t, d)).length;
    return { t, pct: relevantDates.length ? Math.round((done / relevantDates.length) * 100) : 0 };
  }).sort((a, b) => b.pct - a.pct).slice(0, 5);

  return `
    ${rangeToggle}
    <div class="fin-section">
      <div class="row-between" style="margin-bottom:2px;">
        <h3 style="font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0;">Выполнено привычек</h3>
        <span class="mono" style="font-size:18px;font-weight:600;color:#E8A33D;">${avg}%</span>
      </div>
      ${chartHTML}
    </div>

    <div class="summary-grid">
      <div><div class="stat-label">Выполнено всего</div><div class="stat-value mono">${totalCompletions}</div></div>
      <div><div class="stat-label">Лучшая серия</div><div class="stat-value mono" style="color:#E8A33D;">${bestStreak} ${ICONS.fire}</div></div>
    </div>

    <div class="fin-section">
      <div class="fin-title"><h3>Топ привычек</h3></div>
      ${topHabits.length === 0 ? `<div class="empty-state">Пока нет ежедневных привычек.</div>` : topHabits.map(({t, pct}) => `
        <div class="cat-bar-item">
          <div class="cat-bar-head"><span>${escapeHtml(t.title)}</span><span class="mono muted">${pct}%</span></div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${(LIST_STYLE[t.list]||LIST_STYLE.admin).color};"></div></div>
        </div>`).join("")}
    </div>

    <div class="fin-section">
      <div class="fin-title">${ICONS.trophyMuted}<h3>Достижения (${state.gamify.unlocked.length}/${ACHIEVEMENTS.length})</h3></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${ACHIEVEMENTS.map(a => {
          const unlocked = state.gamify.unlocked.includes(a.id);
          return `<div title="${a.desc}" style="width:64px;text-align:center;opacity:${unlocked?1:0.35};">
            <div style="width:44px;height:44px;border-radius:50%;background:${unlocked?'#E8A33D22':'#1B1F23'};border:1px solid ${unlocked?'#E8A33D':'#262C31'};display:flex;align-items:center;justify-content:center;margin:0 auto;">
              ${unlocked ? ICONS.fire : ICONS.snowMuted}
            </div>
            <div style="font-size:9px;color:#8B95A1;margin-top:4px;line-height:1.2;">${a.label}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

  const dateLabel = now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });

  const tabContent = state.tab === "tasks" ? tasksTabHTML()
    : state.tab === "goals" ? goalsTabHTML()
    : state.tab === "finance" ? financeTabHTML()
    : state.tab === "stats" ? statsTabHTML()
    : notesTabHTML();
  const editingTask = state.editingTaskId ? state.tasks.find(t => t.id === state.editingTaskId) : null;

  app.innerHTML = `
    <header>
      <div class="eyebrow"><span>${dateLabel}</span></div>
      <h1>Панель дня</h1>
    </header>
    <main>${tabContent}</main>
    <nav class="tabbar"><div class="inner">
      <button data-action="set-tab" data-tab="tasks">${ICONS.tabTasks(state.tab==='tasks')}<span style="color:${state.tab==='tasks'?'#E8A33D':'#57616B'}">Задачи</span></button>
      <button data-action="set-tab" data-tab="goals">${ICONS.tabGoals(state.tab==='goals')}<span style="color:${state.tab==='goals'?'#E8A33D':'#57616B'}">Цели</span></button>
      <button data-action="set-tab" data-tab="finance">${ICONS.tabFinance(state.tab==='finance')}<span style="color:${state.tab==='finance'?'#E8A33D':'#57616B'}">Финансы</span></button>
      <button data-action="set-tab" data-tab="stats">${ICONS.tabStats(state.tab==='stats')}<span style="color:${state.tab==='stats'?'#E8A33D':'#57616B'}">Статистика</span></button>
      <button data-action="set-tab" data-tab="notes">${ICONS.tabNotes(state.tab==='notes')}<span style="color:${state.tab==='notes'?'#E8A33D':'#57616B'}">Заметки</span></button>
    </div></nav>
    ${editingTask ? taskEditModalHTML(editingTask) : ""}
  `;
}

// ---------- Event delegation ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "set-tab") { state.tab = el.dataset.tab; state.showAddTask = false; render(); }
  else if (action === "set-tasks-view") { state.tasksView = el.dataset.view; state.showAddTask = false; render(); }
  else if (action === "set-filter") { state.filter = el.dataset.filter; state.showAddTask = false; render(); }
  else if (action === "set-finance-view") { state.financeView = el.dataset.view; render(); }
  else if (action === "set-stats-range") { state.statsRange = el.dataset.range; render(); }
  else if (action === "set-tx-type") { state.txType = el.dataset.type; render(); }
  else if (action === "toggle-add-task") { state.showAddTask = !state.showAddTask; render(); }

  else if (action === "toggle-task") {
    const id = el.dataset.id, ctxDate = el.dataset.date;
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    let becameDone = false;
    if (t.repeat === "daily") {
      const wasDone = t.doneDates.includes(ctxDate);
      t.doneDates = wasDone ? t.doneDates.filter(d => d !== ctxDate) : [...t.doneDates, ctxDate];
      becameDone = !wasDone;
    } else {
      becameDone = !t.done;
      t.done = !t.done;
    }
    if (becameDone) { state.gamify.totalCompletions++; persistGamify(); checkAchievements(); }
    persistTasks(); render();
  }
  else if (action === "remove-task") {
    state.tasks = state.tasks.filter(t => t.id !== el.dataset.id);
    if (state.editingTaskId === el.dataset.id) state.editingTaskId = null;
    persistTasks(); render();
  }
  else if (action === "toggle-freeze") {
    const id = el.dataset.id, ctxDate = el.dataset.date;
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    if (!t.frozenDates) t.frozenDates = [];
    t.frozenDates = t.frozenDates.includes(ctxDate) ? t.frozenDates.filter(d => d !== ctxDate) : [...t.frozenDates, ctxDate];
    persistTasks(); render();
  }
  else if (action === "open-edit-task") { state.editingTaskId = el.dataset.id; render(); }
  else if (action === "close-edit-task") { state.editingTaskId = null; render(); }
  else if (action === "quick-date") {
    const choice = el.dataset.choice;
    const dateInput = document.getElementById("edit-task-date");
    const repeatSelect = document.getElementById("edit-task-repeat");
    if (choice === "clear") { dateInput.value = ""; }
    else {
      if (repeatSelect.value === "daily") repeatSelect.value = "none";
      if (choice === "today") dateInput.value = todayKey();
      else if (choice === "tomorrow") dateInput.value = addDaysStr(todayKey(), 1);
      else if (choice === "nextweek") dateInput.value = addDaysStr(todayKey(), 7);
    }
  }
  else if (action === "save-edit-task") {
    const id = el.dataset.id;
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    const title = document.getElementById("edit-task-title").value.trim();
    if (!title) return;
    const repeat = document.getElementById("edit-task-repeat").value;
    t.title = title;
    t.date = repeat === "daily" ? null : (document.getElementById("edit-task-date").value || null);
    t.time = document.getElementById("edit-task-time").value || null;
    t.list = document.getElementById("edit-task-list").value;
    t.priority = Number(document.getElementById("edit-task-priority").value);
    t.repeat = repeat;
    const goalSelect = document.getElementById("edit-task-goal");
    if (goalSelect) t.goalId = goalSelect.value || null;
    persistTasks();
    state.editingTaskId = null;
    render();
  }
  else if (action === "submit-task") {
    const title = document.getElementById("new-task-title").value.trim();
    if (!title) return;
    const date = document.getElementById("new-task-date").value || null;
    const time = document.getElementById("new-task-time").value || null;
    const list = document.getElementById("new-task-list").value;
    const priority = Number(document.getElementById("new-task-priority").value);
    const repeat = document.getElementById("new-task-repeat").value;
    state.tasks.push({ id: "c" + Date.now(), title, list, priority, date: repeat === "daily" ? null : date, time, repeat, done: false, doneDates: [], frozenDates: [], goalId: null });
    persistTasks();
    state.showAddTask = false;
    render();
  }

  else if (action === "cal-prev") { state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()-1, 1); render(); }
  else if (action === "cal-next") { state.calCursor = new Date(state.calCursor.getFullYear(), state.calCursor.getMonth()+1, 1); render(); }
  else if (action === "select-date") { state.selectedDate = el.dataset.date; state.showAddTask = false; render(); }

  else if (action === "add-tx") {
    const amount = Number(document.getElementById("new-tx-amount").value);
    if (!amount || amount <= 0) return;
    const category = document.getElementById("new-tx-category").value;
    const date = document.getElementById("new-tx-date").value || todayKey();
    const note = document.getElementById("new-tx-note").value.trim();
    state.transactions.push({ id: "tx" + Date.now(), type: state.txType, amount, category, date, note });
    persistTx(); checkAchievements(); render();
  }
  else if (action === "remove-tx") {
    state.transactions = state.transactions.filter(t => t.id !== el.dataset.id);
    persistTx(); render();
  }

  else if (action === "add-credit") { state.finance.credits.push({ id: "r"+Date.now(), name:"", balance:"", payment:"" }); persistFinance(); render(); }
  else if (action === "add-investment") { state.finance.investments.push({ id: "r"+Date.now(), ticker:"", qty:"", avgPrice:"", price:"" }); persistFinance(); render(); }
  else if (action === "add-account") { state.finance.accounts.push({ id: "r"+Date.now(), type:"cash", name:"", balance:"" }); persistFinance(); render(); }
  else if (action === "add-debt") { state.finance.debts.push({ id: "r"+Date.now(), direction:"i_owe", name:"", amount:"", dueDate:"" }); persistFinance(); render(); }
  else if (action === "add-payment") { state.finance.payments.push({ id: "r"+Date.now(), name:"", amount:"", repeat:"monthly", nextDate: todayKey(), remindDays: 3 }); persistFinance(); render(); }
  else if (action === "remove-fin") {
    const { section, id } = el.dataset;
    state.finance[section] = state.finance[section].filter(r => r.id !== id);
    persistFinance(); render();
  }

  else if (action === "add-area") {
    const name = prompt("Название области жизни (например: Здоровье, Семья, Финансы):");
    if (!name || !name.trim()) return;
    const color = AREA_COLORS[state.areas.length % AREA_COLORS.length];
    state.areas.push({ id: "area" + Date.now(), name: name.trim(), color });
    persistAreas(); checkAchievements(); render();
  }
  else if (action === "remove-area") {
    const id = el.dataset.id;
    state.goals = state.goals.filter(g => g.areaId !== id);
    state.areas = state.areas.filter(a => a.id !== id);
    persistAreas(); persistGoals(); render();
  }
  else if (action === "add-goal") {
    const areaId = el.dataset.area;
    const titleInput = document.getElementById("new-goal-title-" + areaId);
    const dateInput = document.getElementById("new-goal-date-" + areaId);
    const title = titleInput.value.trim();
    if (!title) return;
    state.goals.push({ id: "goal" + Date.now(), areaId, title, targetDate: dateInput.value || null, done: false });
    persistGoals(); checkAchievements(); render();
  }
  else if (action === "toggle-goal") {
    const g = state.goals.find(x => x.id === el.dataset.id);
    if (!g) return;
    g.done = !g.done;
    persistGoals(); if (g.done) checkAchievements(); render();
  }
  else if (action === "remove-goal") {
    state.goals = state.goals.filter(g => g.id !== el.dataset.id);
    persistGoals(); render();
  }

  else if (action === "set-notes-view") { state.notesView = el.dataset.view; render(); }
  else if (action === "note-prev-day") { state.noteDate = addDaysStr(state.noteDate, -1); render(); }
  else if (action === "note-next-day") { state.noteDate = addDaysStr(state.noteDate, 1); render(); }
  else if (action === "note-today") { state.noteDate = todayKey(); render(); }
  else if (action === "open-note-date") { state.noteDate = el.dataset.date; state.notesView = "write"; render(); }
  else if (action === "clear-note") {
    delete state.notes[el.dataset.date];
    persistNotes(); render();
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "note-textarea") {
    const dateStr = state.noteDate;
    const val = el.value;
    if (!state.notes[dateStr]) state.notes[dateStr] = { text: "", updatedAt: null };
    state.notes[dateStr].text = val;
    const footer = document.getElementById("note-footer-info");
    if (footer) footer.textContent = `${noteWordCount(val)} слов · сохранение...`;
    clearTimeout(noteSaveTimer);
    noteSaveTimer = setTimeout(() => {
      if (!val.trim()) { delete state.notes[dateStr]; }
      else { state.notes[dateStr].updatedAt = Date.now(); }
      persistNotes();
      checkAchievements();
      const footer2 = document.getElementById("note-footer-info");
      if (footer2) {
        const label = val.trim() ? `Сохранено в ${new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}` : "Ещё не сохранено";
        footer2.textContent = `${noteWordCount(val)} слов · ${label}`;
      }
    }, 500);
  }
  else if (el.id === "note-search-input") {
    state.noteSearch = el.value;
    const container = document.getElementById("note-archive-results");
    if (container) container.innerHTML = noteArchiveResultsHTML();
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action === "update-fin") {
    const { section, id, field } = el.dataset;
    state.finance[section] = state.finance[section].map(r => r.id === id ? { ...r, [field]: el.value } : r);
    persistFinance();
  }
  else if (el.id === "note-date-picker") {
    state.noteDate = el.value || todayKey();
    render();
  }
});

// ---------- Native notifications (Capacitor) ----------
function hashId(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return Math.abs(h) % 2147483647;
}

async function syncNativeNotifications() {
  if (!window.Capacitor || !Capacitor.isNativePlatform || !Capacitor.isNativePlatform()) return;
  const plugins = Capacitor.Plugins || {};
  const LocalNotifications = plugins.LocalNotifications;
  if (!LocalNotifications) return;
  try {
    const perm = await LocalNotifications.checkPermissions();
    if (perm.display !== "granted") {
      const req = await LocalNotifications.requestPermissions();
      if (req.display !== "granted") return;
    }
    const pending = await LocalNotifications.getPending();
    if (pending.notifications.length) {
      await LocalNotifications.cancel({ notifications: pending.notifications.map(n => ({ id: n.id })) });
    }
    const today = todayKey();
    const toSchedule = [];
    state.tasks.forEach(t => {
      if (!t.time) return;
      const [hh, mm] = t.time.split(":").map(Number);
      const id = hashId(t.id);
      const listLabel = (LIST_STYLE[t.list] || LIST_STYLE.admin).label;
      if (t.repeat === "daily") {
        toSchedule.push({
          id, title: t.title, body: listLabel,
          schedule: { on: { hour: hh, minute: mm }, repeats: true, allowWhileIdle: true }
        });
      } else if (!t.done && t.date && t.date >= today) {
        const when = new Date(t.date + "T" + t.time + ":00");
        if (when.getTime() > Date.now()) {
          toSchedule.push({
            id, title: t.title, body: listLabel,
            schedule: { at: when, allowWhileIdle: true }
          });
        }
      }
    });
    state.finance.payments.forEach(p => {
      if (!p.nextDate || !p.amount) return;
      const remindDays = Number(p.remindDays) || 0;
      const remindDate = addDaysStr(p.nextDate, -remindDays);
      const when = new Date(remindDate + "T10:00:00");
      if (when.getTime() > Date.now()) {
        toSchedule.push({
          id: hashId("payment-" + p.id),
          title: "Платёж: " + p.name,
          body: fmtRub(p.amount) + " — " + fmtDateShort(p.nextDate),
          schedule: { at: when, allowWhileIdle: true }
        });
      }
    });
    if (toSchedule.length) await LocalNotifications.schedule({ notifications: toSchedule });
  } catch (e) { console.error("notif sync error", e); }
}

try {
  render();
  syncNativeNotifications();
} catch (e) {
  var app = document.getElementById('app');
  if (app) app.innerHTML = '<div style="padding:20px;color:#E2574C;font-family:monospace;font-size:12px;white-space:pre-wrap;">ОШИБКА при запуске:\n' + e.message + '\n\n' + (e.stack || '') + '</div>';
}
